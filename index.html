<title>Cotizador para técnicos</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f4;--card:#fff;--ink:#14213d;--mut:#5b6678;--line:#d3d9e1;--acc:#f2b705;--accink:#14213d;--wa:#1f9d55;--bad:#b3261e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1624;--card:#18223a;--ink:#eef1f6;--mut:#9aa6bb;--line:#2c3856;--acc:#f2b705;--accink:#14213d;--wa:#34c070;--bad:#ff8a80}}
:root[data-theme="dark"]{--bg:#0f1624;--card:#18223a;--ink:#eef1f6;--mut:#9aa6bb;--line:#2c3856;--acc:#f2b705;--accink:#14213d;--wa:#34c070;--bad:#ff8a80}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 Barlow,system-ui,sans-serif;padding:16px}
main{max-width:720px;margin:0 auto}
h1{font:700 30px/1 "Barlow Condensed",Barlow,sans-serif;margin:4px 0 2px;letter-spacing:.2px}
.sub{color:var(--mut);margin:0 0 14px}
.sheet{background:var(--card);border:1px solid var(--line);border-top:6px solid var(--acc);border-radius:6px;padding:16px}
label{display:block;font-weight:600;font-size:14px;margin:0 0 4px}
input,textarea{width:100%;font:inherit;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:4px;padding:9px 10px}
input:focus,textarea:focus,button:focus-visible,a.btn:focus-visible{outline:3px solid var(--acc);outline-offset:1px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
@media(max-width:520px){.g2{grid-template-columns:1fr}}
h2{font:700 20px/1 "Barlow Condensed",Barlow,sans-serif;margin:18px 0 8px}
.row{display:grid;grid-template-columns:1fr 64px 84px 28px;gap:6px;align-items:start;margin-bottom:8px}
.row .imp{grid-column:1/4;text-align:right;color:var(--mut);font-size:14px;margin-top:-2px}
.row .x{width:28px;height:38px;padding:0;border:0;background:transparent;color:var(--bad);font-size:20px;cursor:pointer}
.hd{display:grid;grid-template-columns:1fr 64px 84px 28px;gap:6px;font-size:13px;color:var(--mut);font-weight:600}
.tot{margin-top:14px;border-top:2px solid var(--ink);padding-top:10px}
.tot div{display:flex;justify-content:space-between;padding:2px 0}
.tot .t{font:700 28px/1.1 "Barlow Condensed",Barlow,sans-serif}
button,a.btn{font:600 16px Barlow,sans-serif;border-radius:4px;border:1px solid var(--ink);background:transparent;color:var(--ink);padding:10px 14px;cursor:pointer;text-decoration:none;display:inline-block;text-align:center}
.add{width:100%;border-style:dashed;margin-top:2px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.acts .wa{grid-column:1/3;background:var(--wa);border-color:var(--wa);color:#fff;font-size:18px;padding:13px}
.acts .pri{background:var(--acc);border-color:var(--acc);color:var(--accink)}
#msg{min-height:22px;margin:10px 2px 0;font-size:14px;color:var(--mut)}
.rm{margin-top:12px;text-align:center}
.rm button{border:0;color:var(--mut);text-decoration:underline;font-size:14px}
.brand{display:flex;align-items:center;gap:10px;margin-top:4px}
.brand img{border-radius:10px;flex:none}
</style>
</head>

<p class="sub">Materiales, cantidad y costo. Guarda el archivo, edítalo cuando quieras y mándalo por WhatsApp.</p>
<div class="sheet">
  <div class="g2">
    <div><label for="cli">Nombre del cliente</label><input id="cli" placeholder="Ej. Juan Pérez" autocomplete="off"></div>
    <div><label for="fec">Fecha</label><input id="fec" type="date"></div>
  </div>
  <div style="margin-bottom:12px"><label for="trab">Trabajo</label><input id="trab" placeholder="Ej. Instalación de minisplit"></div>
  <h2>Lista de materiales</h2>
  <div class="hd"><span>Material</span><span>Cant.</span><span>Costo c/u</span><span></span></div>
  <div id="rows"></div>
  <button class="add" id="add" type="button">+ Agregar material</button>
  <h2>Mano de obra</h2>
  <input id="mo" type="number" inputmode="decimal" min="0" step="any" placeholder="Costo de mano de obra (opcional)">
  <div class="tot">
    <div><span>Materiales</span><span id="sm">$0.00</span></div>
    <div><span>Mano de obra</span><span id="smo">$0.00</span></div>
    <div class="t"><span>Total</span><span id="st">$0.00</span></div>
  </div>
  <div class="acts">
    <a class="btn wa" id="wa" href="#" target="_blank" rel="noopener">Enviar por WhatsApp</a>
    <button class="pri" id="save" type="button">Guardar archivo</button>
    <button id="openb" type="button">Abrir archivo</button>
    <button id="pdf" type="button">Crear PDF</button>
    <button id="copy" type="button">Copiar texto</button>
  </div>
  <input id="file" type="file" accept=".json,application/json" hidden>
  <div id="msg" role="status"></div>
</div>
<div class="rm"><button id="new" type="button">Empezar cotización nueva</button></div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
var money=function(n){return '$'+(n||0).toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2})};
var KEY='cotizador-borrador';
function say(t){$('msg').textContent=t}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function addRow(m){
  var r=document.createElement('div');r.className='row';
  r.innerHTML='<input class="n" placeholder="Material" aria-label="Material"><input class="c" type="number" inputmode="decimal" min="0" step="any" placeholder="1" aria-label="Cantidad"><input class="p" type="number" inputmode="decimal" min="0" step="any" placeholder="0.00" aria-label="Costo unitario"><button class="x" type="button" aria-label="Quitar material">×</button><div class="imp">Importe: $0.00</div>';
  if(m){r.querySelector('.n').value=m.nombre||'';r.querySelector('.c').value=m.cantidad;r.querySelector('.p').value=m.costo}
  r.querySelector('.x').onclick=function(){r.remove();upd()};
  $('rows').appendChild(r);
}
function data(){
  var items=[].map.call($('rows').children,function(r){return{nombre:r.querySelector('.n').value.trim(),cantidad:parseFloat(r.querySelector('.c').value)||0,costo:parseFloat(r.querySelector('.p').value)||0}}).filter(function(m){return m.nombre||m.costo||m.cantidad});
  return{cliente:$('cli').value.trim(),fecha:$('fec').value,trabajo:$('trab').value.trim(),materiales:items,manoDeObra:parseFloat($('mo').value)||0};
}
function totals(d){var m=d.materiales.reduce(function(s,x){return s+x.cantidad*x.costo},0);return{m:m,mo:d.manoDeObra,t:m+d.manoDeObra}}
function text(d){
  var t=totals(d),L=[];
  L.push('*COTIZACIÓN*');
  if(d.cliente)L.push('Cliente: '+d.cliente);
  if(d.fecha)L.push('Fecha: '+d.fecha.split('-').reverse().join('/'));
  if(d.trabajo)L.push('Trabajo: '+d.trabajo);
  L.push('');L.push('*Materiales*');
  d.materiales.forEach(function(x){L.push('• '+(x.nombre||'Material')+': '+x.cantidad+' x '+money(x.costo)+' = '+money(x.cantidad*x.costo))});
  L.push('Subtotal materiales: '+money(t.m));
  if(d.manoDeObra)L.push('Mano de obra: '+money(t.mo));
  L.push('');L.push('*TOTAL: '+money(t.t)+'*');
  return L.join('\n');
}
function upd(){
  [].forEach.call($('rows').children,function(r){var v=(parseFloat(r.querySelector('.c').value)||0)*(parseFloat(r.querySelector('.p').value)||0);r.querySelector('.imp').textContent='Importe: '+money(v)});
  var d=data(),t=totals(d);
  $('sm').textContent=money(t.m);$('smo').textContent=money(t.mo);$('st').textContent=money(t.t);
  $('wa').href='https://wa.me/?text='+encodeURIComponent(text(d));
  try{localStorage.setItem(KEY,JSON.stringify(d))}catch(e){}
}
function load(d){
  $('cli').value=d.cliente||'';$('fec').value=d.fecha||today();$('trab').value=d.trabajo||'';$('mo').value=d.manoDeObra||'';
  $('rows').innerHTML='';(d.materiales&&d.materiales.length?d.materiales:[null]).forEach(addRow);upd();
}
async function saveAs(name,data,mime){
  var dl=null;try{dl=await claude.use('downloads')}catch(e){}
  if(dl){await dl.save({filename:name,data:data});return}
  var u=URL.createObjectURL(new Blob([data],{type:mime})),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},4000)
}
$('add').onclick=function(){addRow();upd();var i=$('rows').lastChild.querySelector('.n');i.focus()};
document.addEventListener('input',upd);
$('wa').onclick=function(e){if(!data().materiales.length){e.preventDefault();say('Agrega al menos un material antes de enviar.')}};
$('copy').onclick=function(){
  var t=text(data());
  try{navigator.clipboard.writeText(t).then(function(){say('Texto copiado.')},function(){say('No se pudo copiar.')})}catch(e){say('No se pudo copiar.')}
};
$('save').onclick=async function(){
  var d=data();if(!d.cliente&&!d.materiales.length){say('Escribe el cliente o agrega materiales para guardar.');return}
  var name='cotizacion-'+(d.cliente||'cliente').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')+'-'+(d.fecha||today())+'.json';
  try{await saveAs(name,JSON.stringify(d,null,2),'application/json');say('Archivo guardado.')}catch(e){say(e&&e.code==='declined'?'Guardado cancelado.':'No se pudo guardar el archivo.')}
};

function mark(doc){try{doc.setGState(new doc.GState({opacity:.11}));doc.addImage(LOGO,'PNG',58,80,100,135.5);doc.setGState(new doc.GState({opacity:1}))}catch(e){}}
$('pdf').onclick=async function(){
  var d=data();if(!d.materiales.length){say('Agrega al menos un material para crear el PDF.');return}
  if(!window.jspdf){say('No cargó el creador de PDF. Revisa tu conexión.');return}
  var doc=new window.jspdf.jsPDF({unit:'mm',format:'letter'}),t=totals(d),y=20,tx=function(s,x,yy,o){doc.text(String(s),x,yy,o)};
  mark(doc);doc.setFillColor(242,183,5);doc.rect(0,0,216,6,'F');doc.setTextColor(20,33,61);
  doc.setFont('helvetica','bold');doc.setFontSize(22);tx('COTIZACIÓN',15,y);y+=9;
  doc.setFont('helvetica','normal');doc.setFontSize(11);
  if(d.cliente){tx('Cliente: '+d.cliente,15,y);y+=6}
  if(d.fecha){tx('Fecha: '+d.fecha.split('-').reverse().join('/'),15,y);y+=6}
  if(d.trabajo){var tl=doc.splitTextToSize('Trabajo: '+d.trabajo,185);tx(tl,15,y);y+=tl.length*5.5}
  y+=4;
  function head(){doc.setFont('helvetica','bold');doc.setFontSize(10);tx('Material',15,y);tx('Cant.',150,y,{align:'right'});tx('Costo c/u',172,y,{align:'right'});tx('Importe',200,y,{align:'right'});doc.setDrawColor(20,33,61);doc.line(15,y+2,200,y+2);y+=8;doc.setFont('helvetica','normal');doc.setFontSize(11)}
  head();
  d.materiales.forEach(function(x){
    var h=x.foto?17:8;if(y+h>262){doc.addPage();mark(doc);y=20;head()}
    var nx=x.foto?33:15;
    if(x.foto){try{doc.addImage(x.foto,'JPEG',15,y-4,14,14)}catch(e){}}
    var nl=doc.splitTextToSize(x.nombre||'Material',x.foto?100:115).slice(0,2);
    tx(nl,nx,x.foto?y+2:y);
    tx(x.cantidad,150,y,{align:'right'});tx(money(x.costo),172,y,{align:'right'});tx(money(x.cantidad*x.costo),200,y,{align:'right'});
    y+=h;
  });
  if(y>240){doc.addPage();mark(doc);y=20}
  doc.line(120,y-4,200,y-4);
  tx('Materiales',150,y+2,{align:'right'});tx(money(t.m),200,y+2,{align:'right'});y+=7;
  if(d.manoDeObra){tx('Mano de obra',150,y+2,{align:'right'});tx(money(t.mo),200,y+2,{align:'right'});y+=7}
  doc.setFont('helvetica','bold');doc.setFontSize(15);tx('TOTAL',150,y+4,{align:'right'});tx(money(t.t),200,y+4,{align:'right'});
  var nm='cotizacion-'+(d.cliente||'cliente').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')+'-'+(d.fecha||today())+'.pdf';
  try{await saveAs(nm,doc.output('blob'),'application/pdf');say('PDF guardado.')}catch(e){say(e&&e.code==='declined'?'Guardado cancelado.':'No se pudo crear el PDF.')}
};
$('openb').onclick=function(){$('file').click()};
$('file').onchange=function(){
  var f=this.files[0];if(!f)return;var fr=new FileReader();
  fr.onload=function(){try{var d=JSON.parse(fr.result);if(!d||!Array.isArray(d.materiales))throw 0;load(d);say('Cotización abierta. Ya puedes editarla.')}catch(e){say('Ese archivo no es una cotización válida.')}};
  fr.readAsText(f);this.value='';
};
$('new').onclick=function(){if(confirm('¿Borrar esta cotización y empezar una nueva?')){load({});say('')}};
var saved=null;try{saved=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}
load(saved||{});
})();
